name: Update CHANGELOG with Codex

on:
  schedule:
    - cron: '0 22 * * *'  # 每日 6:00 AM (GMT+8)  = 22:00 (UTC)
    - cron: '0 10 * * *'  # 每日 6:00 PM (GMT+8)  = 10:00 (UTC)
  workflow_dispatch:      # 允許手動觸發
    inputs:
      upstream_repo:
        description: 'Upstream repository (owner/repo)'
        required: false
        default: 'github/copilot-cli'
      upstream_branch:
        description: 'Upstream branch to sync from'
        required: false
        default: 'main'

permissions:
  contents: write

jobs:
  auto_update_translation:
    runs-on: ubuntu-latest  # Use a Linux runner for compatibility
    env:
      UPSTREAM_REPO: ${{ inputs.upstream_repo || 'github/copilot-cli' }}
      UPSTREAM_BRANCH: ${{ inputs.upstream_branch || 'main' }}
    steps:
      - name: Clone current and upstream repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p repos

          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            repos/current

          git clone --depth 1 --branch "${UPSTREAM_BRANCH}" \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${UPSTREAM_REPO}.git" \
            repos/upstream

      - name: Prepare minimal translation workspace
        run: |
          mkdir -p repos/translate-work

          cp repos/current/README.md repos/translate-work/README.md
          cp repos/current/changelog.md repos/translate-work/changelog.md
          cp repos/upstream/README.md repos/translate-work/upstream.README.md
          cp repos/upstream/changelog.md repos/translate-work/upstream.changelog.md

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Create Codex config for Azure
        run: |
          mkdir -p ~/.codex
          cat <<EOT > ~/.codex/config.toml
          approval_policy = "never"
          sandbox_mode   = "danger-full-access"

          profile = "aoai"

          [features]
          multi_agent = true
          steer = true

          #####################
          ### Azure Foundry ###
          #####################

          [model_providers.azure]
          name         = "Azure OpenAI"
          base_url     = "https://duotify-ai-foundry.cognitiveservices.azure.com/openai"
          env_key      = "AZURE_OPENAI_API_KEY_CODEX"
          wire_api     = "responses"
          query_params = { api-version = "2025-04-01-preview" }

          [profiles.aoai]
          model_provider          = "azure"
          model                   = "gpt-5.4"
          preferred_auth_method   = "apikey"
          wire_api                = "responses"
          model_reasoning_effort  = "high"
          model_reasoning_summary = "detailed"
          EOT

      - name: Run Codex to update CHANGELOG
        env:
          AZURE_OPENAI_API_KEY_CODEX: ${{ secrets.AZURE_OPENAI_API_KEY_CODEX }}
        run: |
          cd repos/translate-work
          codex exec --skip-git-repo-check --yolo '你只能讀寫 README.md 與 changelog.md，並且只能參考 upstream.README.md 與 upstream.changelog.md。請完成：
          1) README.md：僅在 upstream.README.md 與本地 README.md 有差異時，將 upstream.README.md 全文翻譯為繁體中文（zh-tw）後覆蓋 README.md。
          2) changelog.md：只翻譯 upstream.changelog.md 中本地尚未存在的新版本區塊，翻譯後 prepend 到 changelog.md 前段。
          3) 保持 Markdown 結構、程式碼區塊、URL 與指令內容不變。
          4) 不要搜尋或操作其他檔案。'

      - name: Notify Discord if CHANGELOG is updated
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          cat <<'EOF' > extract.js
          const fs = require('fs');

          function extractVersionBlocks(content) {
            const lines = content.split('\n');

            const headerIndexes = [];
            for (let i = 0; i < lines.length; i += 1) {
              if (lines[i].startsWith('## ')) {
                headerIndexes.push(i);
              }
            }

            return headerIndexes.map((startIndex, index) => {
              const endIndex = index + 1 < headerIndexes.length ? headerIndexes[index + 1] : lines.length;
              const versionBlock = lines.slice(startIndex, endIndex);
              return {
                header: lines[startIndex],
                content: versionBlock.join('\n').trim()
              };
            });
          }

          function extractNewVersionBlocks(oldContent, newContent) {
            const oldHeaders = new Set(extractVersionBlocks(oldContent).map((block) => block.header));
            const newBlocks = extractVersionBlocks(newContent);
            const prependedBlocks = [];

            for (const block of newBlocks) {
              if (oldHeaders.has(block.header)) break;
              prependedBlocks.push(block);
            }

            if (prependedBlocks.length > 0) {
              return prependedBlocks.reverse();
            }

            return newBlocks.filter((block) => !oldHeaders.has(block.header)).reverse();
          }

          const oldFile = 'repos/current/changelog.md';
          const newFile = 'repos/translate-work/changelog.md';
          const oldContent = fs.existsSync(oldFile) ? fs.readFileSync(oldFile, 'utf8') : '';
          const newContent = fs.readFileSync(newFile, 'utf8');
          const newVersionBlocks = extractNewVersionBlocks(oldContent, newContent);
          process.stdout.write(JSON.stringify(newVersionBlocks));
          EOF

          NEW_VERSION_BLOCKS=$(node extract.js)
          NEW_VERSION_COUNT=$(echo "$NEW_VERSION_BLOCKS" | jq 'length')

          if [ "$NEW_VERSION_COUNT" -gt 0 ]; then
            echo "Detected $NEW_VERSION_COUNT new version block(s), sending to Discord in chronological order..."
            for i in $(seq 0 $((NEW_VERSION_COUNT - 1))); do
              VERSION_HEADER=$(echo "$NEW_VERSION_BLOCKS" | jq -r ".[$i].header")
              VERSION_CONTENT=$(echo "$NEW_VERSION_BLOCKS" | jq -r ".[$i].content")

              echo "Sending $VERSION_HEADER ($((i + 1))/$NEW_VERSION_COUNT)..."
              JSON_PAYLOAD=$(jq -n --arg content "$VERSION_CONTENT" '{content: $content}')
              curl -H "Content-Type: application/json" \
                   -X POST \
                   -d "$JSON_PAYLOAD" \
                   "$DISCORD_WEBHOOK_URL"
            done
          else
            echo "No new version detected."
          fi

      - name: Copy translated files back to current repo
        run: |
          cp repos/translate-work/README.md repos/current/README.md
          cp repos/translate-work/changelog.md repos/current/changelog.md

      - name: Commit and push changes if any
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd repos/current

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          git add changelog.md README.md
          git commit -m "Update translations via Codex CLI" || echo "No changes to commit"
          git push origin "${GITHUB_REF_NAME}"
